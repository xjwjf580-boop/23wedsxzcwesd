<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Дневник тренировок — Верх/Низ</title>
<style>html,body{margin:0;min-height:100%;background:#0e1013;color:#e7e9ee;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}#boot{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}#msg{max-width:22em;opacity:.85}</style>
</head>
<body>
<div id="boot"><p id="msg">Загружаю дневник…</p></div>

<script type="text/plain" id="patch">
Object.assign(TECH, {
"Жим штанги лёжа":{how:["Лопатки сведены и прижаты к скамье, грудь вверх, стопы плотно в полу.","Хват чуть шире плеч, гриф над серединой груди.","Опускай 2–3 сек до касания низа груди, локти под 45–60° к корпусу.","Жми мощно вверх по чуть наклонной дуге, вверху локти не защёлкивай.","Первые недели работай в раме или со страхующим."],err:["Локти строго в стороны — риск для плеча","Отбив грифа от груди","Отрыв таза от скамьи","Гриф опускается на шею или на живот"]},
"Подтягивания в гравитроне":{how:["Выставь противовес так, чтобы уверенно делать 8–10 повторов.","Хват чуть шире плеч, колени на подушку, корпус слегка отклонён назад.","Начинай движение с опускания лопаток вниз-назад, потом тяни локтями к рёбрам.","Вверху подбородок выше уровня рук, пауза 1 сек.","Опускайся 2–3 сек до полного растяжения широчайших.","Каждую неделю снижай противовес на 2–5 кг."],err:["Рывки и раскачка корпусом","Тяга только бицепсами, без работы лопаток","Половинная амплитуда — не доводишь себя вверх","Слишком большой противовес, нагрузки почти нет"]}
});
Object.assign(QRY, {
"Жим штанги лёжа":"жим штанги лёжа техника выполнения",
"Подтягивания в гравитроне":"подтягивания в гравитроне техника для новичка"
});
delete TECH["Отведения бедра в тренажёре"];
PROGRAM.upA.ex[0] = {n:"Жим штанги лёжа", s:4, r:"8–12"};
PROGRAM.upA.ex[1] = {n:"Подтягивания в гравитроне", s:4, r:"8–12"};
PROGRAM.lowB.ex = PROGRAM.lowB.ex.filter(function(e){ return e.n !== "Отведения бедра в тренажёре"; });
renderDays();
renderAll();
</script>

<script>
(function(){
  var BASE = "https://raw.githubusercontent.com/xjwjf580-boop/23wedsxzcwesd/c5e11374e94369aeea6ca6ca44725dcdd5662f26/index.html";
  var CACHE = "gymlog_base_html_v1";
  var msg = document.getElementById("msg");
  function boot(html){
    var patch = document.getElementById("patch").textContent;
    var out = html.replace(/<\/body>/i, function(){ return "<scr" + "ipt>" + patch + "<\/scr" + "ipt></body>"; });
    document.open();
    document.write(out);
    document.close();
  }
  var cached = null;
  try { cached = localStorage.getItem(CACHE); } catch(e){}
  if (cached && cached.length > 100000) { boot(cached); return; }
  fetch(BASE).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    return r.text();
  }).then(function(t){
    try { localStorage.setItem(CACHE, t); } catch(e){}
    boot(t);
  }).catch(function(e){
    msg.textContent = "Не удалось загрузить дневник: " + e.message + ". Проверь интернет и обнови страницу."; 
  });
})();
</script>
</body>
</html>

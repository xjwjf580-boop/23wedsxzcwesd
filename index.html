<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Дневник тренировок — Верх/Низ</title>
<style>html,body{margin:0;min-height:100%;background:#0e1013;color:#e7e9ee;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}#boot{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center;opacity:0;animation:bootin 0s linear 1.5s forwards}@keyframes bootin{to{opacity:1}}#msg{max-width:22em;opacity:.85}</style>
</head>
<body>
<div id="boot"><p id="msg">Загружаю дневник…</p></div>

<script type="text/plain" id="extra">
/* Вставка данных «Здоровья» из буфера обмена */
try {
  var NL = String.fromCharCode(10);
  window.hkApply = function(txt){
    if(!txt) return 0;
    var t = String(txt).trim();
    var qi = t.indexOf("?");
    if(qi >= 0) t = t.slice(qi + 1);
    t = t.replace(/[^A-Za-z0-9=.-]+/g, "&");
    var p = new URLSearchParams(t);
    function num(v){ var n = parseFloat(String(v).replace(",", ".")); return isFinite(n) ? n : null; }
    var got = [];
    if(p.has("date")){
      var d = p.get("date");
      if(/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(d)) document.getElementById("date").value = d;
    }
    var s = session(), v;
    v = num(p.get("steps"));
    if(v !== null){ s.steps = String(Math.round(v)); got.push("шаги " + s.steps); }
    v = num(p.get("pulse"));
    if(v !== null){ s.pulse = String(Math.round(v)); got.push("пульс " + s.pulse); }
    v = num(p.get("bw"));
    if(v !== null){ s.bw = String(Math.round(v * 10) / 10); got.push("вес " + s.bw); }
    v = num(p.get("cardio"));
    if(v !== null){ s.cardio = String(Math.round(v)); got.push("кардио " + s.cardio); }
    var ex = [];
    v = num(p.get("kcal"));
    if(v !== null){ ex.push("Активные ккал: " + Math.round(v)); got.push("ккал " + Math.round(v)); }
    v = num(p.get("sleep"));
    if(v !== null){ ex.push("Сон: " + (Math.round(v * 10) / 10) + " ч"); got.push("сон " + (Math.round(v * 10) / 10) + " ч"); }
    if(ex.length){
      var keep = String(s.note || "").split(NL).filter(function(ln){
        return ln.indexOf("Активные ккал:") !== 0 && ln.indexOf("Сон:") !== 0;
      });
      keep.push(ex.join(", "));
      s.note = keep.join(NL).trim();
    }
    if(!got.length) return 0;
    save();
    renderAll();
    if (typeof renderHist === "function") renderHist();
    if (typeof updateProgress === "function") updateProgress();
    if (typeof toast === "function") toast("Из «Здоровья»: " + got.join(", "));
    return got.length;
  };

  var _hb = document.getElementById("hkbtn");
  if (_hb && !document.getElementById("hkpaste")) {
    _hb.insertAdjacentHTML("afterend",
      '<button type="button" class="btn primary" id="hkpaste" style="margin-top:8px;width:100%">Вставить из буфера</button>');
    var _hint = document.getElementById("hkhint");
    if (_hint) _hint.textContent = "1) Подтянуть — запустит команду. 2) Вернись сюда и нажми «Вставить из буфера».";
    document.getElementById("hkpaste").onclick = function(){
      function manual(){
        var t = prompt("Вставь строку из команды (удержи поле, потом Вставить):", "");
        if(t && !window.hkApply(t)) alert("Не нашёл чисел. Формат: steps=12744;kcal=680;pulse=59");
      }
      try {
        if (navigator.clipboard && navigator.clipboard.readText) {
          navigator.clipboard.readText().then(function(t){
            if(!window.hkApply(t)) manual();
          }).catch(manual);
        } else { manual(); }
      } catch(e){ manual(); }
    };
  }
} catch(e){}
</script>

<script>
(function(){
  var BASE = "https://raw.githubusercontent.com/xjwjf580-boop/23wedsxzcwesd/c5e11374e94369aeea6ca6ca44725dcdd5662f26/index.html";
  var PSRC = "https://raw.githubusercontent.com/xjwjf580-boop/23wedsxzcwesd/01b557ee5d57648f267f399af3768615f53c87ed/index.html";
  var CB = "gymlog_base_html_v1";
  var CP = "gymlog_patch_v2";
  var TAG = "scr" + "ipt";
  var msg = document.getElementById("msg");
  var extra = document.getElementById("extra").textContent;

  function get(key){ try { return localStorage.getItem(key); } catch(e){ return null; } }
  function put(key, val){ try { localStorage.setItem(key, val); } catch(e){} }

  function cut(txt){
    var a = txt.indexOf('id="patch">');
    if(a < 0) return "";
    a = a + 'id="patch">'.length;
    var b = txt.indexOf("</" + TAG + ">", a);
    if(b < 0) return "";
    return txt.slice(a, b);
  }

  function boot(html, patch){
    var i = html.lastIndexOf("</body>");
    if(i < 0) i = html.length;
    var code = "<" + TAG + ">" + patch + String.fromCharCode(10) + extra + "</" + TAG + ">";
    var out = html.slice(0, i) + code + html.slice(i);
    document.open();
    document.write(out);
    document.close();
  }

  function fail(e){
    msg.textContent = "Не удалось загрузить дневник: " + e.message + ". Проверь интернет и обнови страницу.";
  }

  function need(url, key, minLen, pick){
    var c = get(key);
    if(c && c.length > minLen) return Promise.resolve(c);
    return fetch(url).then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    }).then(function(t){
      var val = pick ? pick(t) : t;
      if(!val || val.length < minLen) throw new Error("пустой ответ");
      put(key, val);
      return val;
    });
  }

  Promise.all([
    need(BASE, CB, 100000, null),
    need(PSRC, CP, 2000, cut)
  ]).then(function(res){
    boot(res[0], res[1]);
  }).catch(fail);
})();
</script>
</body>
</html>
